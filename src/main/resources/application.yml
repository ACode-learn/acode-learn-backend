spring:
  application:
    name: acode-learn-backend
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8082

springdoc:
  swagger-ui:
    path: /ui
  title: 'ACode Learn Backend - v@project.version@'
  version: '@springdoc-openapi-starter-webmvc-ui.version@'
openapi:
  output:
    file: 'openapi-@project.name@-v@project.version@.json'